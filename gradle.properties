# Gradle 守护进程 JVM 参数。
# 为什么 -Xmx2048m：AGP 8.x + Kotlin 2.x 打开 R8 全量混淆时 1G 会 OOM，
# 2G 对绝大多数开发机安全；CI 内存更小时可下调，但不要低于 1536m。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 并行构建：多模块工程收益明显，单模块（本项目只有一个 :app）无害。
org.gradle.parallel=true

# 首次构建后使用缓存，二次构建显著变快。
org.gradle.caching=true

# AndroidX 是硬要求：androidx.* 依赖与旧 support 库不能共存。
android.useAndroidX=true

# 本工程不使用 Kotlin 的合成视图（已废弃的 kotlin-android-extensions），
# 因此下面这项按 AGP 8.x 默认值显式写出来，避免被模板工具改回旧默认。
android.nonTransitiveRClass=true

# Kotlin 代码风格使用官方风格。
kotlin.code.style=official
